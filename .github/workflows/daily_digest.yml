name: Daily AI digest
on:
  schedule:
    - cron: "30 6 * * *"   # 06:30 UTC = 12:00 PM IST, every day
  workflow_dispatch:        # lets you run it manually from the Actions tab
permissions:
  contents: write           # needed to save history.json back to the repo
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python run_daily.py
        env:
          GOOGLE_GENAI_USE_VERTEXAI: "FALSE"
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
      - name: Save history so tomorrow's run skips repeats
        run: |
          git config user.name "digest-bot"
          git config user.email "digest-bot@users.noreply.github.com"
          git add data/history.json data/digest_*.md
          git commit -m "Digest $(date -u +%F)" || echo "Nothing to commit"
          git push
